# Cấu hình deploy Render (Blueprint).
# Khi tạo Blueprint, đặt "Blueprint Path" = 06-lab-complete/render.yaml
# (mặc định Render chỉ tìm render.yaml ở gốc repo).

services:
  # ── Redis (Render Key Value) cho rate limit và cost guard ──
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: [] # chỉ service trong cùng tài khoản và region truy cập được
    # Đầy bộ nhớ thì báo lỗi, không tự xoá key chi phí và rate limit
    maxmemoryPolicy: noeviction

  # ── Agent Part 6 ──
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore # cùng region với Redis để nối qua mạng nội bộ
    rootDir: 06-lab-complete
    # Hai đường dẫn dưới tính từ rootDir
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Không đặt PORT: Render tự cấp, CMD trong Dockerfile đọc ${PORT}
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      # Render điền chuỗi kết nối của day14-redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      # Secret: Render tự sinh giá trị ngẫu nhiên, xem ở tab Environment
      - key: AGENT_API_KEY
        generateValue: true
