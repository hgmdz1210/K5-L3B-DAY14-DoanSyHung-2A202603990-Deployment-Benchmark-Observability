# Cấu hình deploy Railway. Chạy `railway up` trong thư mục 06-lab-complete/.
# Biến AGENT_API_KEY và REDIS_URL đặt trên Railway, không ghi vào file này.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: Railway dùng CMD trong Dockerfile, app nghe theo biến PORT
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
