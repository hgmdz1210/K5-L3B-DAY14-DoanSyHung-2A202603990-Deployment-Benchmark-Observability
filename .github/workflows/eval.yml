# Quality gate cho agent Part 7: run_eval.py trả exit code 1 khi accuracy dưới ngưỡng
# hoặc có câu bị regression → job fail.
# Để chặn merge: bật branch protection cho `main` và chọn check "eval" là bắt buộc.
name: quality-gate

on:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent and run eval
        env:
          AGENT_VERSION: v2
          # Tắt lỗi ngẫu nhiên của mock để kết quả CI không phụ thuộc may rủi
          MOCK_ERROR_RATE: "0"
        run: |
          python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 \
            --baseline "$GITHUB_WORKSPACE/reports/eval_v2_fixed.json"
